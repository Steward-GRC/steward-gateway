name: GraphQL codegen
# internal/resolvers' generated code must match graphql/ and gqlgen.yml:
# scripts/gqlgen-generate.sh runs gqlgen and puts the licence header back,
# and any change it makes fails the check.
#
# Pull requests only, and not while the PR is a draft.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gqlgen:
    name: 🧬 GraphQL codegen
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Regenerate
        run: scripts/gqlgen-generate.sh
      - name: Generated code is current
        run: |
          set -euo pipefail
          git diff --exit-code -- internal/resolvers graphql
          test -z "$(git status --porcelain -- internal/resolvers)"
