version: '3'
vars:
  ARTIFACT_NAME: steward-gateway
  TESTPARALLELISM: 4
  GOLIC_VERSION: v0.3.0
  GOLANGCI_VERSION: v2.12.2
  COMMON_LIC: "2026 The Steward Authors"
  TEMPLATE_LIC: "spdx-apache2"
tasks:
  default:
    cmds:
      - task: lint
  fmt:
    desc: Format Go sources
    cmds:
      - gofmt -w .
      - goimports -w ./
  run:
    desc: Run the gateway with the settings in .env
    dotenv: ['.env']
    cmds:
      - go run ./cmd/server
  gqlgen:
    desc: Regenerate the GraphQL code from graphql/ (with the licence header)
    cmds:
      - scripts/gqlgen-generate.sh
  proto:
    desc: Fetch the pinned callee protos and regenerate gen/
    cmds:
      - scripts/proto-generate.sh
  build:
    desc: Build all packages
    cmds:
      - go build ./...
  test:
    desc: Run tests
    cmds:
      - go test -parallel {{.TESTPARALLELISM}} ./...
  test-cover:
    desc: Run tests with coverage reporting
    cmds:
      - go test ./... -cover
  lint:
    desc: Run all linters
    deps: [test]
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi
      - golangci-lint run
      - yamllint .
  vectors:refresh:
    desc: "Refresh the vendored ordered vectors from a go-authz commit: task vectors:refresh COMMIT=<full sha>"
    requires:
      vars: [COMMIT]
    cmds:
      - gh api "repos/Bugs5382/go-authz/contents/testdata/ordered.json?ref={{.COMMIT}}" -H "Accept{{":"}} application/vnd.github.raw" > internal/resolvers/testdata/ordered.json
      - printf 'repo{{":"}} Bugs5382/go-authz\ncommit{{":"}} {{.COMMIT}}\npath{{":"}} testdata/ordered.json\ndate{{":"}} %s\n' "$(gh api "repos/Bugs5382/go-authz/commits/{{.COMMIT}}" -q .commit.committer.date | cut -c1-10)" > internal/resolvers/testdata/ordered.SOURCE
  lint-init:
    desc: Install lint dependencies (golangci-lint is built with the local Go toolchain)
    cmds:
      - brew install gitleaks yamllint
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}}
      - go install golang.org/x/tools/cmd/goimports@latest
  license:
    desc: Verify every source file carries the Apache-2.0 license header (CI; never writes).
    cmds:
      - go install github.com/Bugs5382/golic/cmd/golic@{{.GOLIC_VERSION}}
      - golic inject -t {{.TEMPLATE_LIC}} -c "{{.COMMON_LIC}}" --dry -x
  license:fix:
    desc: Inject the Apache-2.0 header into any source file missing it.
    cmds:
      - go install github.com/Bugs5382/golic/cmd/golic@{{.GOLIC_VERSION}}
      - golic inject -t {{.TEMPLATE_LIC}} -c "{{.COMMON_LIC}}"
